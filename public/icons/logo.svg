<!--
  ⚠️ 루트에 width/height 를 박지 않는다. 박으면 CSS 로 크기를 주지 않는 곳에서
  항상 128px 로 그려져 작은 컨테이너를 넘친다(실측으로 겪었다). viewBox 만 두면
  쓰는 쪽 크기에 맞춰 늘어난다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-label="이지직">
  <title>이지직</title>
  <!--
    이지직 로고.

    색상은 치지직 브랜드 계열을 따른다 — 강조색 #00ffa3 (확장 UI 에서 쓰는 값과 동일),
    배경은 치지직 다크 UI 계열 #141517.
    글자는 이니셜 `EZ` 두 글자를 쓰고, 치지직 워드마크의 **앞으로 기울어진 굵은** 느낌을 살린다.

    ⚠️ 16px 에서도 읽혀야 한다(확장 아이콘). 한 글자(`M`)일 때보다 두 글자가 불리하므로
    다음을 지켜 형태가 뭉치지 않게 했다:
    - 글자 높이를 76 로 키우고 획 두께 16 / 속공간 14 로 잡았다 (16px 기준 획 2px, 골 1.75px).
      획보다 골이 얇아지면 E 의 가로 획 3개가 한 덩어리로 뭉친다.
    - E 의 가운데 획을 위·아래보다 짧게 잘라 오른쪽에 숨 쉴 공간을 뒀다.
    - 두 글자 사이를 12 띄웠다 (16px 기준 1.5px). 이보다 좁히면 EZ 가 한 글자로 보인다.

    획 강조(치지직 헤더의 `_tail_` 꼬리 획, viewBox 0 0 9 10)는 넣어 봤으나 **빼는 것이
    더 낫다고 판단해 제거했다** (2026-08-13 결정). 작은 크기에서 글자와 뭉친다.
    되살릴 일이 있으면 https://chzzk.naver.com/ 헤더 인라인 SVG 가 원본이다.
  -->
  <defs>
    <linearGradient id="cm-ez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cffc4" />
      <stop offset="1" stop-color="#00ffa3" />
    </linearGradient>
  </defs>

  <!-- 배경: 치지직 다크 계열 + 강조색 테두리 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#141517" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#00ffa3"
        stroke-opacity="0.28" stroke-width="3" />

  <!--
    이니셜 EZ. `skewX(-8)` 로 앞으로 기울인다(치지직 워드마크의 기울기 방향).
    skewX 는 x 를 `x - tan(8°)·y` 로 옮기므로 아래쪽이 더 왼쪽으로 가 위가 오른쪽으로 기운다.
    글자 영역이 y 26~102 라 평균 이동량이 약 9px → 그만큼 되돌려 가운데를 맞춘다
    (기운 뒤 실제 좌우 끝은 15.7 ~ 112.4, 중심 64.0).
  -->
  <g transform="translate(9 0) skewX(-8)" fill="url(#cm-ez)">
    <!-- E: 세로 기둥 x21~37, 가로 획 3개(위·아래는 x58 까지, 가운데는 x52 에서 끊는다) -->
    <path d="M21 26 H58 V42 H37 V56 H52 V72 H37 V86 H58 V102 H21 Z" />
    <!-- Z: 위·아래 가로 획 + 사선. 사선은 가로 폭 21 로 잡아야 수직 두께가 16 이 된다 -->
    <path d="M70 26 H107 V42 L91 86 H107 V102 H70 V86 L86 42 H70 Z" />
  </g>
</svg>
