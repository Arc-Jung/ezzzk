<!--
  ⚠️ 루트에 width/height 를 박지 않는다. 박으면 CSS 로 크기를 주지 않는 곳에서
  항상 128px 로 그려져 작은 컨테이너를 넘친다(실측으로 겪었다). viewBox 만 두면
  쓰는 쪽 크기에 맞춰 늘어난다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-label="이지직">
  <title>이지직</title>
  <!--
    이지직 로고.

    색상은 치지직 브랜드 계열을 따른다 — 강조색 #00ffa3 (확장 UI 에서 쓰는 값과 동일),
    배경은 치지직 다크 UI 계열 #141517.
    글자는 이니셜 `M` 하나만 쓰고, 치지직 워드마크의 **앞으로 기울어진 굵은** 느낌을 살린다.

    획 강조(flick)는 **치지직이 실제로 쓰는 도형을 그대로 가져왔다.**
    치지직 워드마크는 GIF 라 경로를 뽑을 수 없었지만, 같은 페이지의 `_tail_` 클래스 SVG
    (viewBox 0 0 9 10) 가 그 꼬리 획이다 — 지어내지 않고 실물 path 를 쓴다.
    출처: https://chzzk.naver.com/ 헤더 영역 인라인 SVG (2026-08-13 확인)

    ⚠️ 16px 에서도 읽혀야 한다(확장 아이콘). 그래서
    - 획 두께를 두껍게 잡고 안쪽 V 골을 깊게 파 M 형태가 뭉치지 않게 했다
    - flick 은 M 과 **떨어뜨려** 두 덩어리로 보이게 했다. 붙이면 작은 크기에서 한 덩어리가 된다
  -->
  <defs>
    <linearGradient id="cm-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cffc4" />
      <stop offset="1" stop-color="#00ffa3" />
    </linearGradient>
  </defs>

  <!-- 배경: 치지직 다크 계열 + 강조색 테두리 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#141517" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#00ffa3"
        stroke-opacity="0.28" stroke-width="3" />

  <!--
    이니셜 M. `skewX(-8)` 로 앞으로 기울인다(치지직 워드마크의 기울기 방향).
    skewX 는 x 를 `x - tan(8°)·y` 로 옮기므로 아래쪽이 더 왼쪽으로 가 위가 오른쪽으로 기운다.
    평균 이동량(약 9px)만큼 되돌려 가운데를 맞춘다.

    ⚠️ 획 강조(치지직의 꼬리 획)를 넣어 봤으나 **빼는 것이 더 낫다고 판단해 제거했다**
    (2026-08-13 결정). M 하나만 두면 16px 에서 형태가 가장 또렷하고, 획을 붙이면
    작은 크기에서 두 덩어리로 뭉친다. 되살릴 일이 있으면 치지직 헤더의 `_tail_` SVG
    (viewBox 0 0 9 10) 가 원본이다.
  -->
  <g transform="translate(9 0) skewX(-8)">
    <path fill="url(#cm-m)"
          d="M26 96 V32 H46 L64 62 L82 32 H102 V96 H85 V60 L70 84 H58 L43 60 V96 Z" />
  </g>
</svg>
