# main 에 머지될 때마다 패치 버전을 0.0.1 올리고 태그·릴리스를 만든다.
#
# 왜 `push: branches: [main]` 이 아니라 `workflow_run` 인가:
# 깨진 main 에 태그를 박으면 그 태그로 만들어진 릴리스를 되돌릴 방법이 없다.
# CI(`ci.yml`)가 **초록불일 때만** 돌게 묶는다.
#
# 왜 태그 push 트리거(`push: tags: v*`)로 릴리스를 나누지 않았는가:
# `GITHUB_TOKEN` 으로 push 한 태그는 다른 워크플로를 **트리거하지 않는다**(GitHub 사양).
# 나눠 두면 태그만 생기고 릴리스는 영원히 안 만들어진다. 그래서 한 잡에서 끝낸다.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# 버전 번호는 순서가 있다. 동시에 돌면 같은 버전을 두 번 만든다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 무한 루프 방지 1차: 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 한다.
    # (2차는 커밋 메시지의 `[skip ci]` — 그러면 CI 가 아예 안 돌아 workflow_run 도 안 뜬다.)
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event ==
      'push' && !startsWith(github.event.workflow_run.head_commit.message, 'chore: Bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # 태그 비교와 릴리스 노트 생성에 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: 다음 버전 계산
        id: next
        run: |
          set -euo pipefail

          # 무한 루프 방지 3차 + 중복 릴리스 방지.
          # 머지가 연달아 일어나면 늦게 시작한 실행이 이미 태그된 커밋을 다시 잡는다.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD 에 이미 태그가 있다 ($(git describe --exact-match --tags HEAD)) — 건너뛴다"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -e 'const p=require("./package.json");const m=/^(\d+)\.(\d+)\.(\d+)$/.exec(p.version);if(!m){console.error("version 이 x.y.z 형식이 아니다: "+p.version);process.exit(1)}console.log(m[1]+"."+m[2]+"."+(Number(m[3])+1))')
          echo "다음 버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: 버전 기록
        if: steps.next.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        # 🔴 JSON 을 통째로 다시 쓰지 않는다 — 들여쓰기·키 순서가 바뀌어 diff 가 더러워진다.
        # 버전 값만 치환하고, 치환이 안 되면 조용히 넘어가지 않고 실패시킨다.
        # `manifest.json` 도 함께 올린다. `pack:crx` 가 두 값이 다르면 거부한다.
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const file of ["package.json", "manifest.json"]) {
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(/("version"\s*:\s*")\d+\.\d+\.\d+(")/, "$1" + version + "$2");
              if (after === before) {
                console.error("[bump] 버전 치환 실패: " + file);
                process.exit(1);
              }
              fs.writeFileSync(file, after);
            }
          '
          git --no-pager diff --stat

      - uses: actions/setup-node@v4
        if: steps.next.outputs.proceed == 'true'
        with:
          node-version: '24.18.0'
          cache: yarn

      - name: 의존성 설치
        if: steps.next.outputs.proceed == 'true'
        run: yarn install --frozen-lockfile

      # 🔴 태그를 밀기 **전에** 빌드한다. 빌드가 깨지면 아무것도 남기지 않고 끝나야 한다.
      - name: 빌드
        if: steps.next.outputs.proceed == 'true'
        run: yarn build

      # 🔴 `CRX_PRIVATE_KEY` 가 없으면 `pack:crx` 는 **임시 키를 만들어** 조용히 서명한다.
      # 그러면 확장 ID 가 릴리스마다 바뀌어 기존 설치와 다른 확장이 된다 — 자동 배포에서 이게
      # 나가면 되돌릴 수 없으므로 여기서 먼저 끊는다.
      - name: 서명 키 확인
        if: steps.next.outputs.proceed == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CRX_PRIVATE_KEY}" ]; then
            echo "::error::CRX_PRIVATE_KEY 시크릿이 없다. 임시 키로 서명하면 확장 ID 가 바뀐다."
            exit 1
          fi
          echo "서명 키 주입 확인"

      - name: 패키징
        if: steps.next.outputs.proceed == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: yarn pack:crx

      - name: 커밋·태그 push
        if: steps.next.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        # `[skip ci]` 로 이 커밋에 대한 CI 실행을 막는다 — 그래야 workflow_run 이 다시 뜨지 않는다.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json manifest.json
          git commit -m "chore: Bump version to $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # `.zip` 과 `.crx` 를 함께 올린다. `.crx` 는 `CRX_PRIVATE_KEY` 로 서명해 확장 ID 가 고정된다
      # (`fbejfdmjjaakniijpphfckapfdobaggk`). 위 「서명 키 확인」이 통과했을 때만 여기까지 온다.
      - name: 릴리스 생성
        if: steps.next.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          # 설치 방법을 릴리스 본문 맨 위에 붙인다 — 받는 사람이 README 로 건너가지 않아도 되게.
          # `--generate-notes` 는 이 본문 **아래에** 자동 변경 로그를 덧붙인다.
          cat > release-notes.md <<'NOTES'
          ## 설치 방법

          > ⭐ **`.zip` 설치를 권장한다.** 크롬·엣지는 보안 정책상 **스토어 밖에서 배포된 `.crx`
          > 설치를 차단**하는 경우가 많다 — `.zip` 은 이 차단이 없어 항상 동작한다.

          ### 방법 1 — `.zip` 압축해제 후 로드 (Chrome · Edge 공통, 권장)

          1. 위 Assets 에서 `ezzzk-<version>.zip` 을 내려받아 **압축을 푼다**
          2. 주소창에 `chrome://extensions` (엣지는 `edge://extensions`)
          3. **개발자 모드** 켜기 (Chrome 은 우측 상단, Edge 는 좌측 하단)
          4. **압축해제된 확장 프로그램을 로드** (Edge 는 **압축을 풀린 항목 로드**)
          5. 압축을 푼 폴더 선택 — `manifest.json` 이 **바로 안에** 있는 폴더여야 한다
          6. `https://chzzk.naver.com` 접속

          압축 해제 위치는 아무 곳이나 되지만, **폴더를 지우거나 옮기면 확장이 비활성화**된다.
          지워지지 않는 경로에 둔다. `.zip` 설치는 서명 키를 쓰지 않아 **확장 ID 가 다르게 잡히는 것이 정상**이다.

          ### 방법 2 — `.crx` 드래그앤드롭

          1. 위 Assets 에서 `ezzzk-<version>.crx` 를 내려받는다
          2. 주소창에 `chrome://extensions` (엣지는 `edge://extensions`) 를 열고 **개발자 모드** 켜기
          3. 파일 관리자(macOS Finder / Windows 탐색기)에서 `.crx` 파일을 **확장 관리 페이지 위로 끌어다 놓기**
             - ⚠️ 주소창에 파일 경로를 입력하는 방식으로는 설치되지 않는다
          4. 확인 대화상자에서 **확장 프로그램 추가**
          5. `"Chrome 웹 스토어에서 제공되지 않는 확장 프로그램은 추가할 수 없습니다"` 또는
             `CRX_REQUIRED_PROOF_MISSING` 이 뜨면 → 방법 1(`.zip`) 로 진행한다

          `.crx` 는 고정된 서명 키로 서명한다. 확장 ID 는 항상 `fbejfdmjjaakniijpphfckapfdobaggk` 이며,
          같은 ID 를 유지하므로 다음 버전을 같은 방식으로 덮어 설치하면 설정이 그대로 이어진다.

          ### 설치 후 확인

          - 확장 목록에 **이지직** 과 버전이 보인다
          - 치지직 라이브 페이지 컨트롤바 우측에 `멀티` · `⚙*` 버튼이 보인다

          ### 업데이트 · 제거

          스토어 밖 설치는 자동 업데이트가 되지 않는다. 새 버전이 나오면 같은 절차를 다시 한다
          (`.zip` 경로는 **같은 폴더에 덮어쓰고** 확장 관리 페이지에서 **새로 고침**).
          제거는 확장 관리 페이지에서 **삭제** — `.zip` 으로 설치했다면 압축을 푼 폴더도 함께 지운다.

          ---
          NOTES
          gh release create "v$VERSION" \
            "release/ezzzk-$VERSION.zip" \
            "release/ezzzk-$VERSION.crx" \
            --title "이지직 $VERSION" \
            --notes-file release-notes.md \
            --generate-notes
          rm -f release-notes.md
