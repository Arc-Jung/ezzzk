name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: yarn

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: 타입 검사
        run: yarn typecheck

      - name: 린트
        run: yarn lint

      - name: 포맷 검사
        run: yarn format:check

      - name: 유닛·통합 테스트
        run: yarn test

      - name: 빌드
        run: yarn build
